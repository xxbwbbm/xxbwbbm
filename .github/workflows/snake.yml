# Đặt file này tại: .github/workflows/snake.yml trong repo profile
name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"   # chạy mỗi ngày lúc 00:00 UTC
  workflow_dispatch:       # cho phép bấm chạy tay

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          # Rắn màu trắng như hoa hồng, các ô từ xanh đêm đến xanh lam sáng
          outputs: |
            dist/snake.svg?color_snake=#eaf1ff&color_dots=#0e113e,#111f69,#172e80,#3f5bd9,#8aa2ff

      - uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
