# Đặt file này tại: .github/workflows/profile-3d.yml trong repo profile
# File profile-3d-night.json đặt ở thư mục gốc của repo
name: GitHub-Profile-3D-Contrib

on:
  schedule:
    - cron: "0 18 * * *"   # chạy mỗi ngày lúc 18:00 UTC (01:00 giờ VN)
  workflow_dispatch:       # cho phép bấm chạy tay

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: yoshi389111/github-profile-3d-contrib@latest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}
          SETTING_JSON: profile-3d-night.json
      - name: Commit & Push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add -A .
          if git commit -m "generated 3D contrib"; then
            git push
          fi
